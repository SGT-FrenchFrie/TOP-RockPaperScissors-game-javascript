<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let computer_choice = Math.random();
        if (computer_choice <= 0.33) {
            computer_choice = 1;
        }
        else if (computer_choice <= 0.66) {
            computer_choice = 2;
        }
        else {
            computer_choice = 3;
        }
        alert("pick your choice for rock paper and scissors! ");
        let user_choice = parseInt(prompt("1. rock, 2. paper, 3.scissors"));
         

        if (user_choice == computer_choice) {
            console.log("ITS A DRAW!");
 }
        else if (user_choice == 1 && computer_choice == 3) {
            console.log("You Win!!!!");
        }
        else if (user_choice == 2 && computer_choice == 1) {
            console.log("You Win!!!!");
        }
        else if (user_choice == 3 && computer_choice == 2) {
            console.log("You Win!!!!");
        }

        else {
            console.log("You Lose :(")
        }

    </script>
    
</body>
</html>
